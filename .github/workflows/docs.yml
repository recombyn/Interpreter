# Deploy CNI docs to GitHub Pages

name: Deploy Docs

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: cni-docs-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_DOCS_BASE: /concept-network-interpreter/
          VITE_APP_URL: https://github.com/recombyn/concept-network-interpreter

      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          publish_branch: gh-pages
          force_orphan: true
          # Commit as repo owner so github-actions[bot] does not appear in Contributors.
          user_name: TianMeng
          user_email: 51704449+recombyn@users.noreply.github.com
