[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "para"
version = "0.1.0"
description = "Para: symbolic Chinese NLU (isa/of facts, no LLM)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
para = "para.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
para = ["data/world/*.tm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
